{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Order</title>
    <link rel="stylesheet" href="{% static 'pos/css/create_order.css' %}">
</head>
<body>

    <div id="notification"></div>

    <div class="container">
    <a href="{% url 'order_list' %}" class="btn-back" style="margin-bottom: 1rem; display: inline-block;">&#8592; Back to Orders</a>
        <header>
            <h1>New Order</h1>
            <p style="color: var(--text-muted)">Add items and checkout instantly</p>
        </header>

        <div class="order-card" style="margin-bottom: 1.5rem;">
            <div style="margin-bottom: 0.75rem;">
                <label for="customer-select" style="display: block; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Customer (Optional)</label>
                <select id="customer-select" style="width: 100%;">
                    <option value="">— Walk-in / No Customer —</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.name }} {% if customer.email %}({{ customer.email }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="order-card">
            <div class="items-header">
                <div>Product</div>
                <div>Quantity</div>
                <div style="text-align: right">Total</div>
                <div></div>
            </div>

            <div id="order-items-container">
                <!-- Items will be injected here via JS -->
            </div>

            <div class="actions">
                <button class="btn-add" onclick="addOrderItem()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Add Product
                </button>

                <div class="summary">
                    <div style="color: var(--text-muted); margin-bottom: 0.25rem;">Total Amount</div>
                    <div class="grand-total">$<span id="grand-total">0.00</span></div>
                    <button class="btn-submit" id="submit-btn" onclick="submitOrder()" disabled>
                        Complete Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const productsData = JSON.parse('{{ products_json|escapejs }}');
        
        // Setup initial CSRF Token helper
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        let itemCount = 0;

        function addOrderItem() {
            itemCount++;
            const container = document.getElementById('order-items-container');
            
            const row = document.createElement('div');
            row.className = 'order-item';
            row.id = `item-row-${itemCount}`;
            
            let optionsHtml = '<option value="" disabled selected>Select a product...</option>';
            productsData.forEach(p => {
                optionsHtml += `<option value="${p.id}" data-price="${p.price}">${p.name} ($${p.price})</option>`;
            });

            row.innerHTML = `
                <select class="product-select" onchange="calculateRowTotal(${itemCount})">
                    ${optionsHtml}
                </select>
                <input type="number" class="quantity-input" min="1" value="1" oninput="calculateRowTotal(${itemCount})">
                <div class="item-total">$<span id="total-${itemCount}">0.00</span></div>
                <button class="btn-remove" onclick="removeOrderItem(${itemCount})" title="Remove Item">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            
            container.appendChild(row);
            updateSubmitButtonState();
        }

        function removeOrderItem(id) {
            const row = document.getElementById(`item-row-${id}`);
            if (row) {
                row.remove();
                calculateGrandTotal();
                updateSubmitButtonState();
            }
        }

        function calculateRowTotal(id) {
            const row = document.getElementById(`item-row-${id}`);
            const select = row.querySelector('.product-select');
            const qtyInput = row.querySelector('.quantity-input');
            const totalSpan = document.getElementById(`total-${id}`);
            
            const selectedOption = select.options[select.selectedIndex];
            if (selectedOption.value) {
                const price = parseFloat(selectedOption.getAttribute('data-price'));
                const qty = parseInt(qtyInput.value) || 0;
                totalSpan.textContent = (price * qty).toFixed(2);
            } else {
                totalSpan.textContent = "0.00";
            }
            
            calculateGrandTotal();
            updateSubmitButtonState();
        }

        function calculateGrandTotal() {
            let total = 0;
            const itemTotals = document.querySelectorAll('.item-total span');
            itemTotals.forEach(span => {
                total += parseFloat(span.textContent) || 0;
            });
            document.getElementById('grand-total').textContent = total.toFixed(2);
        }

        function updateSubmitButtonState() {
            const btn = document.getElementById('submit-btn');
            const rows = document.querySelectorAll('.order-item');
            
            let isValid = rows.length > 0;
            
            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.quantity-input');
                if (!select.value || parseInt(qtyInput.value) < 1) {
                    isValid = false;
                }
            });

            btn.disabled = !isValid;
        }

        function showNotification(msg, isError = false) {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.className = isError ? 'notify-error' : 'notify-success';
            notif.style.transform = 'translateX(0)';
            
            setTimeout(() => {
                notif.style.transform = 'translateX(150%)';
            }, 3000);
        }

        async function submitOrder() {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const items = [];
            const rows = document.querySelectorAll('.order-item');
            
            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.quantity-input');
                
                items.push({
                    product_id: parseInt(select.value),
                    quantity: parseInt(qtyInput.value)
                });
            });

            const customerId = document.getElementById('customer-select').value;
            const payload = { items };
            if (customerId) payload.customer_id = parseInt(customerId);

            const targetUrl = window.location.pathname;

            try {
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification('Order created successfully!');
                    // Clear the form
                    document.getElementById('order-items-container').innerHTML = '';
                    calculateGrandTotal();
                    addOrderItem(); // Add empty row back
                    updateSubmitButtonState();
                    btn.textContent = 'Complete Order';
                } else {
                    showNotification(data.error || 'Failed to create order', true);
                    btn.disabled = false;
                    btn.textContent = 'Complete Order';
                }
            } catch (error) {
                showNotification('Network error occurred', true);
                btn.disabled = false;
                btn.textContent = 'Complete Order';
            }
        }

        // Add one initial empty row
        addOrderItem();
    </script>
</body>
</html>
