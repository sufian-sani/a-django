<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Order</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
            --success: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 0.5rem 0;
        }

        .order-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .items-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 50px;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .order-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 50px;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        select, input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .item-total {
            font-weight: 600;
            color: #60a5fa;
            text-align: right;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-remove {
            background: transparent;
            color: var(--danger);
            padding: 0.5rem;
            font-size: 1.25rem;
            width: 100%;
            height: 100%;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .btn-add {
            background: transparent;
            color: var(--accent);
            border: 2px dashed var(--border);
            padding: 0.75rem 1.5rem;
        }

        .btn-add:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .summary {
            text-align: right;
        }

        .grand-total {
            font-size: 2rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 1rem;
        }

        .btn-submit {
            background: var(--accent);
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #notification {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            transform: translateX(150%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
        }

        .notify-success { background: var(--success); }
        .notify-error { background: var(--danger); }
    </style>
</head>
<body>

    <div id="notification"></div>

    <div class="container">
        <header>
            <h1>New Order</h1>
            <p style="color: var(--text-muted)">Add items and checkout instantly</p>
        </header>

        <div class="order-card">
            <div class="items-header">
                <div>Product</div>
                <div>Quantity</div>
                <div style="text-align: right">Total</div>
                <div></div>
            </div>

            <div id="order-items-container">
                <!-- Items will be injected here via JS -->
            </div>

            <div class="actions">
                <button class="btn-add" onclick="addOrderItem()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Add Product
                </button>

                <div class="summary">
                    <div style="color: var(--text-muted); margin-bottom: 0.25rem;">Total Amount</div>
                    <div class="grand-total">$<span id="grand-total">0.00</span></div>
                    <button class="btn-submit" id="submit-btn" onclick="submitOrder()" disabled>
                        Complete Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const productsData = JSON.parse('{{ products_json|escapejs }}');
        
        // Setup initial CSRF Token helper
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        let itemCount = 0;

        function addOrderItem() {
            itemCount++;
            const container = document.getElementById('order-items-container');
            
            const row = document.createElement('div');
            row.className = 'order-item';
            row.id = `item-row-${itemCount}`;
            
            let optionsHtml = '<option value="" disabled selected>Select a product...</option>';
            productsData.forEach(p => {
                optionsHtml += `<option value="${p.id}" data-price="${p.price}">${p.name} ($${p.price})</option>`;
            });

            row.innerHTML = `
                <select class="product-select" onchange="calculateRowTotal(${itemCount})">
                    ${optionsHtml}
                </select>
                <input type="number" class="quantity-input" min="1" value="1" oninput="calculateRowTotal(${itemCount})">
                <div class="item-total">$<span id="total-${itemCount}">0.00</span></div>
                <button class="btn-remove" onclick="removeOrderItem(${itemCount})" title="Remove Item">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            
            container.appendChild(row);
            updateSubmitButtonState();
        }

        function removeOrderItem(id) {
            const row = document.getElementById(`item-row-${id}`);
            if (row) {
                row.remove();
                calculateGrandTotal();
                updateSubmitButtonState();
            }
        }

        function calculateRowTotal(id) {
            const row = document.getElementById(`item-row-${id}`);
            const select = row.querySelector('.product-select');
            const qtyInput = row.querySelector('.quantity-input');
            const totalSpan = document.getElementById(`total-${id}`);
            
            const selectedOption = select.options[select.selectedIndex];
            if (selectedOption.value) {
                const price = parseFloat(selectedOption.getAttribute('data-price'));
                const qty = parseInt(qtyInput.value) || 0;
                totalSpan.textContent = (price * qty).toFixed(2);
            } else {
                totalSpan.textContent = "0.00";
            }
            
            calculateGrandTotal();
            updateSubmitButtonState();
        }

        function calculateGrandTotal() {
            let total = 0;
            const itemTotals = document.querySelectorAll('.item-total span');
            itemTotals.forEach(span => {
                total += parseFloat(span.textContent) || 0;
            });
            document.getElementById('grand-total').textContent = total.toFixed(2);
        }

        function updateSubmitButtonState() {
            const btn = document.getElementById('submit-btn');
            const rows = document.querySelectorAll('.order-item');
            
            let isValid = rows.length > 0;
            
            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.quantity-input');
                if (!select.value || parseInt(qtyInput.value) < 1) {
                    isValid = false;
                }
            });

            btn.disabled = !isValid;
        }

        function showNotification(msg, isError = false) {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.className = isError ? 'notify-error' : 'notify-success';
            notif.style.transform = 'translateX(0)';
            
            setTimeout(() => {
                notif.style.transform = 'translateX(150%)';
            }, 3000);
        }

        async function submitOrder() {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const items = [];
            const rows = document.querySelectorAll('.order-item');
            
            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.quantity-input');
                
                items.push({
                    product_id: parseInt(select.value),
                    quantity: parseInt(qtyInput.value)
                });
            });

            // If we are passing through the a-django main routing it might be under /pos/
            // Lets assume current URL is fine or absolute path /pos/create-order/
            let targetUrl = window.location.pathname; 

            try {
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ items: items })
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification('Order created successfully!');
                    // Clear the form
                    document.getElementById('order-items-container').innerHTML = '';
                    calculateGrandTotal();
                    addOrderItem(); // Add empty row back
                    updateSubmitButtonState();
                    btn.textContent = 'Complete Order';
                } else {
                    showNotification(data.error || 'Failed to create order', true);
                    btn.disabled = false;
                    btn.textContent = 'Complete Order';
                }
            } catch (error) {
                showNotification('Network error occurred', true);
                btn.disabled = false;
                btn.textContent = 'Complete Order';
            }
        }

        // Add one initial empty row
        addOrderItem();
    </script>
</body>
</html>
